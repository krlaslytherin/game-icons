(page*size,(page+1)*size)){const b=document.createElement('button');b.className='tile';b.title='Icons made by '+x.author;const i=document.createElement('i');i.className='gi '+x.class;i.setAttribute('aria-hidden','true');const s=document.createElement('small');s.textContent=x.class;const code='<i class="gi '+x.class+'"></i>';const c=document.createElement('code');c.textContent=code;b.append(i,s,c);b.onclick=()=>{ $('selected-code').value=code;$('copy-code').disabled=false;copyCode(code)};$('grid').append(b)}$('page').textContent=(page+1)+' / '+pages;$('prev').disabled=page===0;$('next').disabled=page+1>=pages}for(const id of ['q','category'])$(id).addEventListener('input',()=>{page=0;render()});$('prev').onclick=()=>{page--;render()};$('next').onclick=()=>{page++;render()};render();</script></html>
